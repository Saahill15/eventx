services:
  - type: web
    name: eventx-api
    env: python
    buildCommand: cd back && pip install -r requirements.txt
    startCommand: cd back && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        value: sqlite:///./eventx.db
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://eventxapp.in,https://www.eventxapp.in
      - key: APP_ENV
        value: production
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: eventx-db
      mountPath: /opt/render/project/src
      sizeGB: 1

  - type: web
    name: eventx-front
    env: node
    buildCommand: cd front && npm install && npm run build
    startCommand: cd front && npm start -- --port $PORT
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_API_URL
        value: https://eventx-api.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://eventxapp.in
